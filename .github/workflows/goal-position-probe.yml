name: Initial U23 position discovery
on:
  push:
    branches: [main]
    paths: ['src/goal_position_probe.py','.github/workflows/goal-position-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install goal-api
      - name: Collect player roles and tactical lineup positions
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python src/goal_position_probe.py
