name: Validate GOAL API official Python SDK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal-api-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official GOAL API SDK
        run: pip install goal-api
      - name: Test officially supported SDK (no secret disclosure)
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from goal_api import GoalAPI, GoalAPIError
          key=os.getenv("GOAL_API_KEY","")
          if not key:
              raise SystemExit("GOAL_API_KEY missing")
          print("SECRET_STATUS=PRESENT")
          try:
              with GoalAPI(key,timeout=20,max_retries=0) as client:
                  calls=[
                    ("leagues.list",lambda:client.leagues.list(limit=1)),
                    ("players.search",lambda:client.players.search("Dorgeles Nene",limit=2)),
                  ]
                  for label, call in calls:
                      try:
                          res=call()
                          print(label,"SUCCESS",sorted(res.keys()) if isinstance(res,dict) else type(res).__name__)
                          if isinstance(res,dict) and isinstance(res.get("data"),list):
                              print(label,"ROWS",len(res["data"]))
                              if res["data"] and isinstance(res["data"][0],dict):
                                  print(label,"FIELDS",sorted(res["data"][0].keys())[:30])
                      except GoalAPIError as exc:
                          print(label,"API_ERROR",str(getattr(exc,"code","unknown"))[:120])
                          raise
          except Exception as exc:
              print("REQUEST_ERROR_TYPE",type(exc).__name__)
              raise
          print("GOAL SDK API TEST PASSED — NO SHEET ROWS MODIFIED")
          PY
