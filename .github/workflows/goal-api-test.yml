name: Validate GOAL API connection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal-api-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safely check key and provider access
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key=os.getenv("GOAL_API_KEY","")
          if not key:
              raise SystemExit("SECRET_STATUS=MISSING. Create GOAL_API_KEY in Actions repository secrets.")
          print("SECRET_STATUS=PRESENT")
          base="https://api.goal-api.com/v1"
          results=[]
          for path in ("/leagues?limit=1", "/leagues/cmr77dw0q00eprx06rqew3m48", "/players/search?q=Dorgeles%20Nene"):
              req=urllib.request.Request(base+path,headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:
                      data=json.load(res)
                      print("ENDPOINT",path,"HTTP",res.status)
                      if isinstance(data,dict):
                          print("RESPONSE_KEYS",sorted(data.keys())[:18])
                          payload=data.get("data",None)
                          if isinstance(payload,dict):
                              print("DATA_KEYS",sorted(payload.keys())[:28])
                          elif isinstance(payload,list):
                              print("DATA_COUNT",len(payload))
                              if payload and isinstance(payload[0],dict):
                                  print("FIRST_ROW_KEYS",sorted(payload[0].keys())[:30])
                      results.append(True)
              except urllib.error.HTTPError as e:
                  raw=e.read(3000).decode("utf-8","replace")
                  print("RESPONSE_META", "content-type="+str(e.headers.get("Content-Type","?")), "server="+str(e.headers.get("Server","?")), "html="+str(raw.lstrip().startswith("<")))
                  if "<title>" in raw.lower():
                      i=raw.lower().find("<title>")+7
                      title=raw[i:i+120].split("<")[0].replace(key,"[REDACTED]")
                      print("HTML_TITLE",title)
                  try:
                      body=json.loads(raw)
                  except (ValueError,TypeError):
                      body={}
                  print("ERROR_FIELDS",sorted(body.keys()) if isinstance(body,dict) else type(body).__name__)
                  if isinstance(body,dict):
                      for field in ("error","message","code","detail","status"):
                          val=body.get(field)
                          if val is not None:
                              print("ERROR_"+field.upper(),str(val).replace(key,"[REDACTED]")[:180])
                  detail=body.get("error") if isinstance(body,dict) else None
                  if isinstance(detail,dict): detail=str(detail.get("code") or detail.get("category") or "")
                  if not detail and isinstance(body,dict): detail=body.get("code") or body.get("message") or ""
                  detail=str(detail).replace(key,"[REDACTED]")[:150]
                  print("ENDPOINT",path,"HTTP",e.code,"ERROR_TYPE",detail)
                  results.append(False)
              except Exception as e:
                  print("ENDPOINT",path,"ERROR_TYPE",type(e).__name__)
                  results.append(False)
          if not all(results):
              raise SystemExit("GOAL API access incomplete; no spreadsheet update attempted.")
          print("API connection OK; schema inspection done. No spreadsheet updates attempted.")
          PY
