name: Validate official-match aggregation code
on:
  push:
    branches: [main]
    paths: ['tests/test_official_csv.py','.github/workflows/validate-official-code.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/goal_all_official_export.py src/goal_publish_csv.py src/goal_apply_csv_to_sheet.py
      - run: python -m unittest discover -s tests -p 'test_official_csv.py' -v
