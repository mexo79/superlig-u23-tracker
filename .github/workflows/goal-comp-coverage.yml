name: Probe official competitions fixture statistics
on:
  push:
    branches: [main]
    paths: ['src/goal_competition_coverage.py','.github/workflows/goal-comp-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install goal-api
      - name: Test cup UEFA and international player-stat coverage
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python src/goal_competition_coverage.py
