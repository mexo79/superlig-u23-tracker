name: Probe 2026-27 Super Lig player data
on:
  push:
    paths:
      - '.github/workflows/goal-initial-probe.yml'
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install goal-api
      - name: Inspect current season and candidate player statistics
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY'
          import os, json
          from goal_api import GoalAPI
          ID="cmr77dw0q00eprx06rqew3m48"
          with GoalAPI(os.environ["GOAL_API_KEY"],timeout=23,max_retries=0) as client:
              checks=[
                ("league.get",lambda:client.leagues.get(ID)),
                ("league.teams",lambda:client.leagues.teams(ID,season="2026-2027",limit=100)),
                ("league.results",lambda:client.leagues.results(ID,limit=3)),
                ("player.search.Nene",lambda:client.players.search("Dorgeles Nene",limit=10)),
                ("player.search.Kacper",lambda:client.players.search("Kacper Kozlowski",limit=10)),
              ]
              samples=[]
              for label,method in checks:
                  try:
                      r=method()
                      d=r.get("data",[])
                      if label.startswith("player.search") and isinstance(d,list):
                          for p in d:
                              if p.get("id") and len(samples)<4: samples.append((label,p))
                      print("PROBE",label,json.dumps(d[:3] if isinstance(d,list) else d,ensure_ascii=False,default=str)[:4000])
                      if isinstance(d,list): print("PROBE_COUNT",label,len(d),"PAGE",str(r.get("pagination"))[:150])
                  except Exception as e:
                      print("PROBE_ERROR",label,type(e).__name__,str(e)[:180])
              for label,p in samples[:4]:
                  try:
                      rid=str(p["id"])
                      r=client.players.statistics(rid,season="2026-2027")
                      print("STAT_FOR",label,json.dumps({"name":p.get("name"),"playerId":rid,"data":r.get("data")},ensure_ascii=False,default=str)[:4000])
                  except Exception as e:
                      print("STAT_ERROR",label,type(e).__name__,str(e)[:200])
          PY
