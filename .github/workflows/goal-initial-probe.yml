name: Probe current 2026-27 fixture events and player match stats
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal-initial-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install goal-api
      - name: Probe finished fixture lineups and events
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY'
          import os,json
          from goal_api import GoalAPI
          ID="cmr77dw0q00eprx06rqew3m48"
          def preview(label,obj,maxlen=6000):
              print("PROBE",label,json.dumps(obj,ensure_ascii=False,default=str)[:maxlen])
          with GoalAPI(os.environ["GOAL_API_KEY"],timeout=24,max_retries=0) as g:
              for method in [
                  ("league.teams.no-season",lambda:g.leagues.teams(ID,limit=100)),
                  ("league.teams.slash-season",lambda:g.leagues.teams(ID,season="2026/2027",limit=100)),
                  ("teams.list",lambda:g.teams.list(leagueId=ID,limit=100)),
                  ("league.results",lambda:g.leagues.results(ID,**{"from":"2026-08-01","to":"2026-10-29","limit":100})),
              ]:
                  label,fun=method
                  try:
                      data=fun()
                      rows=data.get("data",[])
                      preview(label,{"count":len(rows),"pagination":data.get("pagination"),"sample":rows[:2]},2800)
                      if label=="league.results" and rows:
                          first=next((x for x in rows if x.get("matchStatus")=="FINISHED"),rows[0])
                          matchid=first["id"]
                  except Exception as e:
                      print("PROBE_ERROR",label,type(e).__name__,str(e)[:200])
              for label,method in [
                  ("lineups",lambda:g.fixtures.lineups(matchid)),
                  ("events",lambda:g.fixtures.events(matchid)),
                  ("fixture",lambda:g.fixtures.get(matchid)),
                  ("statistics",lambda:g.fixtures.statistics(matchid))
              ]:
                  try:
                      d=method()
                      preview(label,d.get("data"),7000)
                  except Exception as e:
                      print("PROBE_ERROR",label,type(e).__name__,str(e)[:200])
          PY
