name: Export 2026-27 all official competitions
on:
  push:
    branches: [main]
    paths: ['src/goal_all_official_export.py','.github/workflows/goal-all-official-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install goal-api
      - name: Export official non-Super-Lig player game statistics
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python src/goal_all_official_export.py
