name: Daily U23 player performance sync
on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * *'
      timezone: 'Europe/Istanbul'
permissions:
  contents: read
concurrency:
  group: superlig-u23-sheet-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GOAL API and Google Sheets libraries
        run: pip install -r requirements.txt
      - name: Test parser syntax
        run: python -m py_compile src/goal_season_export.py src/goal_sheet_sync.py
      - name: Check secrets
        id: prerequisite
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOAL_API_KEY" ] || [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOAL_API_KEY or GOOGLE_SERVICE_ACCOUNT_JSON missing. Google Sheet NOT updated."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull current season and refresh Google Sheet
        if: steps.prerequisite.outputs.configured == 'true'
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1eyhOf-1Vv3LmYCRmodFMBsxAflYIRH7l3iUThRHdVuM
        run: python src/goal_sheet_sync.py
