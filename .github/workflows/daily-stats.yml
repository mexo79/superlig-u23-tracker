name: Super Lig U23 - daily integration status
on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * *'
      timezone: 'Europe/Istanbul'
permissions:
  contents: read
jobs:
  verify-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GOAL API setup (no live write until provider access is verified)
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          if not os.getenv("GOAL_API_KEY"):
              raise SystemExit("GOAL_API_KEY is missing. No statistics were updated.")
          print("GOAL_API_KEY is configured.")
          if not os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON"):
              print("::warning::Google Sheets write credentials not configured; no statistics were updated.")
          url="https://api.goal-api.com/v1/leagues/cmr77dw0q00eprx06rqew3m48"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GOAL_API_KEY"],"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=25) as res:
                  response=json.load(res)
              if not isinstance(response,dict) or not response.get("success"):
                  raise SystemExit("GOAL API returned unexpected payload. No statistics were updated.")
              print("Provider reachable. Player schema and Google Sheets writes still require validation.")
          except urllib.error.HTTPError as e:
              print(f"::warning::GOAL API HTTP {e.code}; provider blocked access or denied request. No stats updated.")
          except Exception as e:
              print(f"::warning::GOAL API connectivity failed ({type(e).__name__}); no stats updated.")
          PY
