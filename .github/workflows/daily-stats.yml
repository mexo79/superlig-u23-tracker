name: Super Lig U23 - daily player statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * *'
      timezone: 'Europe/Istanbul'

permissions:
  contents: read

concurrency:
  group: superlig-u23-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Offline parser and aggregation tests
        run: python -m unittest discover -s tests -v
      - name: Verify provider and Sheets configuration
        id: config
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$RAPIDAPI_KEY" ] || [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::API or Google credentials are missing. Database was NOT updated."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh current-season player statistics
        if: steps.config.outputs.ready == 'true'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1eyhOf-1Vv3LmYCRmodFMBsxAflYIRH7l3iUThRHdVuM
          LEAGUE_SEASON: 2026-27
        run: python src/rapidapi_sync.py
