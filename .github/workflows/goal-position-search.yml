name: Search remaining U23 positions
on:
  push:
    branches: [main]
    paths: ['src/goal_position_search.py','.github/workflows/goal-position-search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install goal-api
      - name: Query missing squad player role labels
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python src/goal_position_search.py
